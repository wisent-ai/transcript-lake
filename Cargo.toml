[package]
name = "transcript-lake"
version = "0.2.4"
edition = "2021"
rust-version = "1.85"
description = "Privacy-masked local event archive for coding-agent transcripts"
license = "MIT"
repository = "https://github.com/wisent-ai/transcript-lake"
publish = false
# Real native-store journeys are registered explicitly and require their
# documented inputs; they do not synthesize transcript providers.
autotests = false

[[bin]]
name = "transcript-lake"
path = "src/main.rs"

[[test]]
name = "harness-ingestion"
path = "tests/harnesses/ingestion.rs"

[[test]]
name = "harness-omp-usage"
path = "tests/harnesses/omp_usage.rs"

[[test]]
name = "devin-chains"
path = "tests/devin/chains.rs"

[[test]]
name = "partitions-unlistable"
path = "tests/partitions/unlistable.rs"

[[test]]
name = "junie-damaged-line"
path = "tests/junie/damaged_line.rs"

[[test]]
name = "cursor-damaged-record"
path = "tests/cursor/damaged_record.rs"

[[test]]
name = "devin-damaged-node"
path = "tests/devin/damaged_node.rs"

[[test]]
name = "masking-declaration"
path = "tests/masking/declaration.rs"

[[test]]
name = "codex-completed-user-item"
path = "tests/codex/completed_user_item.rs"

[dependencies]
# preserve_order keeps `extra` in adapter insertion order, so a ported
# partition line is byte-identical to the one the previous implementation wrote.
# float_roundtrip makes JSON.parse-exact doubles: without it serde_json's fast
# float path is off by one ULP, and every stored mtimeMs (cursors.json,
# exports/oko/export-cursors.json) fails its equality check on read, which
# rejects the stream state and forces a full Oko rebuild on every run.
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
regex = "1"
uuid = { version = "1", features = ["v4"] }
gethostname = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
notify = "8"
rusqlite = { version = "0.40.2", features = ["bundled"] }
zstd = "0.14.1"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
